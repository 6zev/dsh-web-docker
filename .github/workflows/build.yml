name: build

# Build the image, verify it actually works, and only then publish to GHCR.
#
# The verify step is not decorative: a build that produces an image which cannot
# serve the UI is worse than no image, because it looks fine in the registry.

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm version of @deepseek-ai/dsh (empty = resolve dist-tags.latest)"
        required: false
        default: ""
      platforms:
        description: "Comma-separated target platforms"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also publish :latest (allowed for pre-releases too, since upstream ships only those)"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  schedule:
    # Upstream publishes on no fixed cadence, so check often. The
    # "already published" gate makes a no-op run cheap: it stops before any
    # build starts when the version on npm is already tagged on the registry.
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - Dockerfile
      - proxy/**
      - scripts/**
      - entrypoint.sh
      - .github/workflows/build.yml

# Never cancel a run that is midway through publishing tags.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # inputs.* is empty outside workflow_dispatch, so give the values that other
  # triggers rely on an explicit fallback here rather than relying on `||`.
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  PUSH_LATEST: ${{ inputs.push_latest || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DSH version
        id: version
        env:
          # Passed through the environment, never interpolated into the script:
          # a workflow input is untrusted text and must not become shell code.
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          fi
          if [ -z "$version" ]; then
            echo "could not resolve a DSH version" >&2
            exit 1
          fi
          # Reject anything that is not a plausible semver before it is used in
          # a tag or a build arg.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "refusing unexpected version string: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A pre-release (containing a hyphen) must never claim :latest.
          case "$version" in
            *-*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "resolved DSH $version"

      # The scheduled run exists to catch a new upstream release. Without this
      # gate every week would rebuild the identical version and overwrite
      # :latest with a byte-different but functionally identical image, which
      # makes the tag useless for "what changed".
      - name: Check whether this version is already published
        id: check
        env:
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Only the scheduled run skips. A manual dispatch or a v* tag is an
          # explicit request to rebuild, even for a version already on the registry.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull needs no auth for a public package.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')" || token=""

          if [ -z "$token" ]; then
            echo "could not get a registry token; building anyway" >&2
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/dsh-${version}")"

          if [ "$code" = "200" ]; then
            echo "dsh-${version} already published; skipping this scheduled build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "dsh-${version} not published (registry said $code); building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # Build and load amd64 only first: this is what the smoke test runs against.
      - name: Build amd64 for verification
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dsh-web:verify
          build-args: |
            DSH_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.check.outputs.skip != 'true'
        run: |
          chmod +x scripts/smoke-test.sh
          IMAGE=dsh-web:verify ./scripts/smoke-test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: always the version-anchored tag, plus a commit tag for traceability.
      # :latest only when explicitly requested.
      - name: Compute tags
        id: tags
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ steps.version.outputs.version }}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          tags="${image}:dsh-${version}"
          tags="${tags},${image}:dsh-${version}-${short_sha}"

          # :latest is opt-in per run (push_latest), and pre-releases are still
          # excluded by default. Upstream ships only pre-releases right now, so
          # the workflow_dispatch input is the switch for deliberately promoting
          # one; a scheduled or tag-triggered build never moves :latest on its own.
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "pre-release ${version}: :latest explicitly requested" >&2
              tags="${tags},${image}:latest"
            else
              echo "pre-release ${version}: not tagging :latest" >&2
            fi
          elif [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags},${image}:latest"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "publishing: ${tags}"

      - name: Build and push multi-arch
        if: github.event_name != 'pull_request' && steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DSH_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### dsh-web build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| DSH version | \`${{ steps.version.outputs.version }}\` |"
            if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
              echo "| Result | skipped — \`dsh-${{ steps.version.outputs.version }}\` already published |"
            else
              echo "| Pre-release | ${{ steps.version.outputs.is_prerelease }} |"
              echo "| Platforms | \`${PLATFORMS}\` |"
              echo "| Smoke test | passed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
