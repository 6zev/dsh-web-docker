name: build

# Build the image, verify it actually works, and only then publish to GHCR.
#
# The verify step is not decorative: a build that produces an image which cannot
# serve the UI is worse than no image, because it looks fine in the registry.
#
# ---------------------------------------------------------------------------
# Why matrix + native runners, not one multi-arch build
# ---------------------------------------------------------------------------
# The old shape was a single job that built linux/amd64+linux/arm64 in one
# buildx invocation on one ubuntu-latest runner. Buildx does run the platforms
# concurrently, but they share the same 4 vCPUs — and the arm64 leg runs under
# QEMU emulation, which is CPU-hungry (node-pty compiles from source on Linux).
# Wall time was therefore close to the sum of the two legs (~16 min).
#
# Now each platform gets its own runner and builds in parallel:
#   amd64 -> ubuntu-latest (native)
#   arm64 -> ubuntu-24.04-arm (native, no QEMU at all)
# Wall time becomes roughly the slower leg instead of the sum.
#
# That shape forces push-by-digest: each build job pushes its own platform
# image by digest, and a merge job then assembles the multi-arch manifest
# (dsh-<version>, dsh-<version>-<sha>, :latest) with `buildx imagetools
# create`. Nothing is tagged :latest until both platforms passed the smoke
# test, so a bad amd64 build can never ship alongside a good arm64 one.
#
# The smoke test still runs before any push: each build job builds the image
# locally (load: true), runs scripts/smoke-test.sh against it, and only then
# rebuilds from cache and pushes by digest.

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm version of @deepseek-ai/dsh (empty = resolve dist-tags.latest)"
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile
      - proxy/**
      - scripts/**
      - entrypoint.sh
      - .github/workflows/build.yml
  schedule:
    # Every 6 hours. Upstream publishes on no fixed cadence, and the
    # "already published" gate makes a no-op run cheap: it stops before any
    # build starts when the version on npm is already tagged on the registry.
    - cron: "0 */6 * * *"
  pull_request:
    paths:
      - Dockerfile
      - proxy/**
      - scripts/**
      - entrypoint.sh
      - .github/workflows/build.yml

# Never cancel a run that is midway through publishing tags.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Resolve the DSH version once and decide whether a scheduled run is a no-op,
  # so both platform jobs agree on the version instead of each resolving npm
  # latest independently (upstream could publish mid-run).
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DSH version
        id: version
        env:
          # Passed through the environment, never interpolated into the script:
          # a workflow input is untrusted text and must not become shell code.
          REQUESTED_VERSION: ${{ inputs.dsh_version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$(npm view @deepseek-ai/dsh dist-tags.latest)"
          fi
          if [ -z "$version" ]; then
            echo "could not resolve a DSH version" >&2
            exit 1
          fi
          # Reject anything that is not a plausible semver before it is used in
          # a tag or a build arg.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "refusing unexpected version string: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Record whether upstream resolved to a pre-release for the job summary.
          case "$version" in
            *-*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "resolved DSH $version"

      # The scheduled run exists to catch a new upstream release. Without this
      # gate every week would rebuild the identical version and overwrite
      # :latest with a byte-different but functionally identical image, which
      # makes the tag useless for "what changed".
      - name: Check whether this version is already published
        id: check
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Only the scheduled run skips. A manual dispatch, branch push, or v* tag
          # is an explicit request to rebuild, even for a version already on the registry.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull needs no auth for a public package.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')" || token=""

          if [ -z "$token" ]; then
            echo "could not get a registry token; building anyway" >&2
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/dsh-${version}")"

          if [ "$code" = "200" ]; then
            echo "dsh-${version} already published; skipping this scheduled build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "dsh-${version} not published (registry said $code); building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary (skipped)
        if: steps.check.outputs.skip == 'true'
        run: |
          {
            echo "### dsh-web build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| DSH version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Result | skipped — \`dsh-${{ steps.version.outputs.version }}\` already published |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prep
    if: needs.prep.outputs.skip != 'true'
    strategy:
      # One platform failing must not kill the other leg's logs/diagnostics.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # No QEMU setup: each leg runs natively on its own architecture.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build this platform only, load it locally, and smoke-test it before
      # anything reaches the registry.
      - name: Build ${{ matrix.platform }} for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: dsh-web:verify
          build-args: |
            DSH_VERSION=${{ needs.prep.outputs.version }}
          # Per-platform cache scope: an amd64 layer cache must never be
          # restored into an arm64 build (or vice versa).
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Smoke test
        run: |
          chmod +x scripts/smoke-test.sh
          IMAGE=dsh-web:verify ./scripts/smoke-test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only (no tags here — the merge job owns the tags).
      # The layer cache from the verify build makes this second build cheap:
      # it reuses every layer and only pushes.
      - name: Build and push ${{ matrix.platform }} by digest
        id: build-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            DSH_VERSION=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      # The digest is the merge job's only input: one file per platform,
      # named after the digest hash, uploaded as an artifact.
      - name: Record digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          if [ -z "$digest" ]; then
            echo "no digest from the push step" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch manifest from the per-platform digests and tag it.
  # Runs only after both platform jobs passed (needs: build) and never on PRs.
  merge:
    needs: [prep, build]
    if: github.event_name != 'pull_request' && needs.prep.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: always publish the version-anchored tag, commit tag, and :latest.
      - name: Create multi-arch manifest and tag it
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ needs.prep.outputs.version }}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"

          digests=""
          for file in /tmp/digests/*; do
            [ -f "$file" ] || continue
            digests="${digests} ${image}@sha256:$(basename "$file")"
          done
          if [ -z "$digests" ]; then
            echo "no platform digests found under /tmp/digests" >&2
            exit 1
          fi

          echo "publishing: ${image}:dsh-${version}, ${image}:dsh-${version}-${short_sha}, ${image}:latest"
          echo "from:${digests}"
          docker buildx imagetools create \
            -t "${image}:dsh-${version}" \
            -t "${image}:dsh-${version}-${short_sha}" \
            -t "${image}:latest" \
            $digests

      - name: Summary
        run: |
          {
            echo "### dsh-web build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| DSH version | \`${{ needs.prep.outputs.version }}\` |"
            echo "| Pre-release | ${{ needs.prep.outputs.is_prerelease }} |"
            echo "| Platforms | \`linux/amd64,linux/arm64\` (matrix, native runners) |"
            echo "| Smoke test | passed (both platforms) |"
          } >> "$GITHUB_STEP_SUMMARY"
